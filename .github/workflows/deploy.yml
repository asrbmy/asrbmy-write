name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *' # daily, so articles dated in the future go live on their day

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Stop before publishing if the tests fail, so a broken change never goes live
      - run: npm run test:unit
      # Production check: lists leftovers from the template (read it in the log; it never blocks the deploy)
      - run: npm run doctor
        continue-on-error: true
      # The build detects the repository name and sets the base path and site URL
      # automatically (user site → "/", project site → "/<repo>").
      # Custom domain? Uncomment and set your own values:
      #   env:
      #     BASE_PATH: ""
      #     SITE_URL: https://example.com
      - run: npm run build
        env:
          # Optional: lets the build fetch "Popular this month" from GoatCounter (see the README)
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
      - run: npm run check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

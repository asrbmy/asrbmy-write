name: Check outside links

# Once a week (and on demand) look for links to other websites that no longer work.
# A failed run shows up in the Actions tab and GitHub emails you; the log lists the links and the pages they are on.
on:
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * 1'

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          QUIET: '1'
      - run: npm run links
